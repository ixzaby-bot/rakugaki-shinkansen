<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16866d">
  <meta name="description" content="指で描いた線路を、緑の新幹線が走るお絵描きゲーム。">
  <title>らくがき新幹線</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="game" aria-label="らくがき新幹線">
    <canvas id="canvas" aria-label="指やマウスで線路を描くキャンバス">Canvasに対応したブラウザで遊んでください。</canvas>
    <header class="heading"><h1>らくがき<span>新幹線</span></h1><p>きみの せんろを はしるよ</p></header>
    <div id="hint" class="hint"><span class="hint-line" aria-hidden="true">〰</span><p>ゆびで せんろを<br>かいてみよう！</p></div>
    <footer><p id="status" role="status">さいごに かいた せんろを はしるよ</p><button id="clear" type="button"><span aria-hidden="true">↺</span> ぜんぶけす</button></footer>
  </main>
</body>
</html>
